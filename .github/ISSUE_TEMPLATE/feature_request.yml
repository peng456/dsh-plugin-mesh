name: 功能建议
description: 想要新的能力 / 觉得现在的行为很别扭
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        写之前先看一眼 [README 的「已知限制」](../blob/main/README.md) 和
        [DESIGN.md](../blob/main/DESIGN.md) —— 有些看起来是缺的功能，是刻意不做的
        （比如自动配对：它会引入一个必须由人保管的秘密）。
  - type: textarea
    id: problem
    attributes:
      label: 你想解决什么问题
      description: 先说场景，再说方案。"我想让两台机器互相派任务"比"加个 API"有用。
      placeholder: 我在公司网段，家里那台机器看不见，每次都要手动确认 IP。
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: 你想到的做法（可以没有）
    validations:
      required: false
  - type: textarea
    id: alternatives
    attributes:
      label: 现在怎么绕过去的
      description: 现有 workaround 往往说明了真正的痛点在哪。
    validations:
      required: false
  - type: checkboxes
    id: scope
    attributes:
      label: 请你确认
      options:
        - label: 这个建议不引入新的运行依赖（这个插件刻意保持零运行依赖）
        - label: 如果需要跨互联网，我已经知道有内置的 tsnet 通道
          required: false
